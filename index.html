<!DOCTYPE html>
<html>
<head>

<title>Hameeds TV3</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}


.layer {

    position:absolute;
    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0;

    transition:opacity 3s ease-in-out;

}


.show {

    opacity:1;

}


/* Info Boxes */

.info-box {

    position:fixed;

    bottom:12px;

    background:rgba(0,0,0,0.60);

    color:white;

    padding:8px 14px;

    border-radius:10px;

    font-family:Arial,sans-serif;

    z-index:10;

}


.weather-box {

    left:12px;

}


.clock-box {

    right:12px;

}


.big-text {

    font-size:18px;

    font-weight:bold;

}


.small-text {

    font-size:12px;

}


</style>

</head>


<body>


<img id="image1" class="layer">

<img id="image2" class="layer">



<!-- Weather -->

<div class="info-box weather-box">

<div class="big-text" id="weather">

🌤 Loading...

</div>

<div class="small-text">

📍 Sepang, Selangor

</div>

</div>



<!-- Clock -->

<div class="info-box clock-box">

<div class="big-text" id="time">

00:00:00 AM

</div>


<div class="small-text" id="day"></div>

<div class="small-text" id="date"></div>


</div>




<script>


// GOOGLE DRIVE API

const GOOGLE_DRIVE_API = 
"https://script.google.com/macros/s/AKfycbyjc8Wo-O6o6ccudFdxMf1A4d2G5lUlMbnLqYgoKwS6RC33W1riXpxsX8wt6Ef--sGP/exec";



let pictures=[];

let current=0;

let active=0;



let img1=document.getElementById("image1");

let img2=document.getElementById("image2");




// LOAD IMAGES


async function loadPictures(){


    const response = await fetch(GOOGLE_DRIVE_API);


    let files = await response.json();



    files.sort((a,b)=>{


        let numA=parseInt((a.name.match(/\d+/)||[9999])[0]);

        let numB=parseInt((b.name.match(/\d+/)||[9999])[0]);


        return numA-numB;


    });



    pictures = files.map(file=>file.url);
    console.log(pictures);



    showNext();


}





function showNext(){


    if(pictures.length===0) return;



    let nextImage=pictures[current];



    if(active===0){


        img2.src=nextImage;

        img2.classList.add("show");

        img1.classList.remove("show");

        active=1;


    }

    else{


        img1.src=nextImage;

        img1.classList.add("show");

        img2.classList.remove("show");

        active=0;


    }



    current++;


    if(current>=pictures.length){

        current=0;

    }


}



loadPictures();


setInterval(showNext,20000);






// CLOCK 12 HOUR FORMAT


function updateClock(){


let now=new Date();



document.getElementById("time").innerHTML =

now.toLocaleTimeString("en-MY",{

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

});



document.getElementById("day").innerHTML =

now.toLocaleDateString("en-MY",{

weekday:"long"

});



document.getElementById("date").innerHTML =

now.toLocaleDateString("en-MY",{

day:"2-digit",

month:"short",

year:"numeric"

});


}



setInterval(updateClock,1000);

updateClock();






// WEATHER


async function updateWeather(){


const url=

"https://api.open-meteo.com/v1/forecast?latitude=2.69&longitude=101.74&current=temperature_2m&timezone=Asia%2FKuala_Lumpur";



const response=await fetch(url);


const data=await response.json();



document.getElementById("weather").innerHTML=

"🌤 "+data.current.temperature_2m+"°C";


}



updateWeather();


setInterval(updateWeather,600000);



</script>


</body>

</html>
